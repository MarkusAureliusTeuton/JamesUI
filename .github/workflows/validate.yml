name: Validate JamesUI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/jamesui

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Validate frontend JavaScript syntax
        run: |
          for file in custom_components/jamesui/frontend/*.js; do
            node --check "$file"
          done

      - name: Test home status model
        run: node --experimental-default-type=module --test tests/jamesui-home.test.js
