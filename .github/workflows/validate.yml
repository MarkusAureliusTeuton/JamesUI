name: Validate JamesUI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/jamesui

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".").rglob("*.json"):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Validate frontend JavaScript syntax
        run: |
          find custom_components/jamesui/frontend -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Test Home Assistant panel entrypoint
        run: python -m unittest tests/test_frontend_entrypoint.py

      - name: Preserve Home Assistant bootstrap behavior
        run: node --experimental-default-type=module --test tests/jamesui-entry-preservation.test.js

      - name: Guard JamesUI Core architecture
        run: python -m unittest tests/test_core_architecture.py

      - name: Test JamesUI Core contracts
        run: |
          node --experimental-default-type=module --test \
            tests/jamesui-core-router.test.js \
            tests/jamesui-core-services.test.js \
            tests/jamesui-core-shell.test.js \
            tests/jamesui-core.test.js

      - name: Test JamesUI module system
        run: |
          node --experimental-default-type=module --test \
            tests/jamesui-module-manifest.test.js \
            tests/jamesui-module-registry.test.js \
            tests/jamesui-module-loader.test.js

      - name: Test JamesUI Block 3 registries and Core actions
        run: |
          node --experimental-default-type=module --test \
            tests/jamesui-capability-registry.test.js \
            tests/jamesui-action-registry.test.js \
            tests/jamesui-core-actions.test.js

      - name: Test JamesUI Block 4 Home Assistant boundary
        run: |
          node --experimental-default-type=module --test \
            tests/jamesui-home-assistant-adapter.test.js \
            tests/jamesui-ha-actions.test.js \
            tests/jamesui-core-ha-integration.test.js

      - name: Test JamesUI Block 5 configuration
        run: |
          python -m unittest \
            tests/test_config_schema.py \
            tests/test_config_migrations.py \
            tests/test_config_service.py \
            tests/test_config_storage_architecture.py \
            tests/test_config_api.py
          node --experimental-default-type=module --test tests/jamesui-config-service.test.js

      - name: Test JamesUI Block 6 design system
        run: node --experimental-default-type=module --test tests/jamesui-design-tokens.test.js

      - name: Validate Alpine atmosphere assets
        run: python -m unittest tests/test_alpine_assets.py

      - name: Test home status model
        run: node --experimental-default-type=module --test tests/jamesui-home.test.js

      - name: Test V11 Start visual polish
        run: node --experimental-default-type=module --test tests/jamesui-v11-style.test.js

      - name: Test Start background settings
        run: node --experimental-default-type=module --test tests/jamesui-background.test.js

      - name: Test Start calendar and scene data
        run: node --experimental-default-type=module --test tests/jamesui-home-data.test.js
