<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JamesUI Next – browser integration fixture</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #app { width: 100%; height: 100dvh; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
    import { createJamesUI1Preview } from "/custom_components/jamesui/frontend/jamesui-1-preview.js";

    // Test-only source ID. No fabricated Home Assistant entities are saved.
    const config = {
      schema_version: 1,
      pages: { home: {
        kind: "dashboard", layout_id: "main", hero_widget_id: "weather",
        elements: [
          { id: "agenda", kind: "widget", ref_id: "agenda", column: 0, row: 0, column_span: 4, row_span: 4 },
          { id: "house", kind: "widget", ref_id: "house", column: 4, row: 0, column_span: 4, row_span: 4 },
          { id: "buttons", kind: "widget", ref_id: "buttons", column: 8, row: 0, column_span: 4, row_span: 4 }
        ]
      } },
      layouts: { main: { kind: "hero-deck", scroll: "fixed", hero_ratio: 0.42 } },
      widget_instances: {
        weather: { module_id: "widget.weather-today", config: {} },
        agenda: { module_id: "widget.calendar-agenda", config: {
          instance_id: "browser-agenda", calendar_enabled: true, tasks_enabled: false,
          calendars: [{ entity_id: "calendar.browser_fixture" }]
        } },
        house: { module_id: "widget.house-quick", config: {
          buttons: [{ id: "lights", type: "lights" }]
        } },
        buttons: { module_id: "widget.dynamic-buttons", config: {
          buttons: [{ id: "navigate", button_id: "navigate", size: "normal", definition: {
            name: "Start", mode: "trigger", action: { type: "navigate", route: "home" }
          } }]
        } }
      },
      dynamic_buttons: {}, data_sources: {}, module_settings: {}
    };

    window.__juiTest = { status: "loading", app: null, error: null };
    const app = createJamesUI1Preview({ document });
    window.__juiTest.app = app;
    app.core.hass = {
      connected: true, states: {},
      callWS: async ({ type }) => {
        if (type !== "jamesui/config/get") throw new Error("Unexpected HA WS: " + type);
        return { config };
      }
    };
    try {
      await app.mount(document.getElementById("app"));
      window.__juiTest.status = "ready";
    } catch (error) {
      window.__juiTest.status = "error";
      window.__juiTest.error = error?.stack ?? String(error);
    }
  </script>
</body>
</html>
